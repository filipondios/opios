name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Linter
        run: bunx @biomejs/biome@2.6.6 lint src test scripts server.js public/js
      - name: Formato
        run: >-
          bunx @biomejs/biome@2.6.6 format
          src
          test
          scripts
          server.js
          public/js
          package.json
          biome.json
          ejemplo
      - name: Ejecutar tests
        run: bun test
